<dialog id="delete-dialog"
        class="w-[calc(100%-2rem)] max-w-sm overflow-hidden rounded-2xl border border-slate-200 bg-white p-0 text-slate-900
               shadow-xl backdrop:bg-slate-900/50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100"
        aria-labelledby="delete-dialog-title">
  <form method="post" id="delete-form" action="">
    {% csrf_token %}
    <input type="hidden" name="week" value="{{ week_param }}">

    <div class="px-5 py-4">
      <h2 id="delete-dialog-title" class="text-lg font-semibold">حذف کلاس</h2>
      <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
        آیا از حذف کلاس
        «<span class="font-semibold" data-delete-title></span>»
        مطمئن هستید؟ این عمل قابل بازگشت نیست.
      </p>
    </div>

    <div class="flex items-center justify-end gap-2 border-t border-slate-200 px-5 py-4 dark:border-slate-800">
      <button type="button" data-dialog-close class="btn">انصراف</button>
      <button type="submit" class="btn btn-danger">حذف کلاس</button>
    </div>
  </form>
</dialog>
