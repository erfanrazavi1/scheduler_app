<article class="flex flex-col rounded-2xl border border-slate-200 bg-slate-50/60 dark:border-slate-800 dark:bg-slate-900/40">
  <header class="flex items-center justify-between gap-2 rounded-t-2xl border-b border-slate-200 px-3 py-2.5
                 dark:border-slate-800 {% if day.is_today %}bg-blue-50 dark:bg-blue-950/40{% endif %}">
    <div class="min-w-0">
      <p class="truncate text-sm font-semibold text-slate-900 dark:text-slate-100" dir="auto">
        {{ day.name }}
      </p>
      <p class="text-xs text-slate-500 dark:text-slate-400" dir="auto">
        {{ day.date_fa }}
      </p>
    </div>
    {% if day.is_today %}
      <span class="chip shrink-0 bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300">امروز</span>
    {% endif %}
  </header>

  <div class="border-b border-slate-200 p-2.5 dark:border-slate-800">
    <button type="button" data-add-class data-day="{{ day.value }}"
            class="btn w-full border-dashed text-xs"
            aria-label="افزودن کلاس به روز {{ day.name }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" class="h-3.5 w-3.5" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      افزودن کلاس
    </button>
  </div>

  <div class="flex flex-1 flex-col gap-2 p-2.5">
    {% for session in day.classes %}
      {% include "schedules/components/class_card.html" with session=session %}
    {% empty %}
      <p class="flex flex-1 items-center justify-center py-6 text-center text-xs text-slate-400 dark:text-slate-500">
        کلاسی برای این روز ثبت نشده است
      </p>
    {% endfor %}
  </div>
</article>
