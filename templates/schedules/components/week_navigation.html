<nav class="flex items-center justify-between gap-2" aria-label="پیمایش هفته">
  <a href="?week={{ prev_week|date:'Y-m-d' }}" class="btn" rel="prev">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" class="h-4 w-4 rtl:rotate-180" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
    <span class="hidden sm:inline">هفته قبل</span>
  </a>

  <div class="flex items-center gap-2">
    <span class="hidden text-sm text-slate-500 dark:text-slate-400 md:inline">
      هفته
      <span class="font-medium text-slate-700 dark:text-slate-200">{{ week_label }}</span>
    </span>
    {% if not is_current_week %}
      <a href="?" class="btn btn-primary">هفته جاری</a>
    {% else %}
      <span class="chip">هفته جاری</span>
    {% endif %}
  </div>

  <a href="?week={{ next_week|date:'Y-m-d' }}" class="btn" rel="next">
    <span class="hidden sm:inline">هفته بعد</span>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" class="h-4 w-4 rtl:rotate-180" aria-hidden="true">
      <path d="M9 18l6-6-6-6"></path>
    </svg>
  </a>
</nav>
