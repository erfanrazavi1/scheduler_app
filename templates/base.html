{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}برنامه هفتگی کلاس‌ها{% endblock %}</title>
  <meta name="description" content="برنامه هفتگی کلاس‌ها — زمان، مدرس و محل برگزاری هر کلاس.">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-full">
  <a href="#main"
     class="sr-only focus:not-sr-only focus:absolute focus:right-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-blue-600 focus:px-4 focus:py-2 focus:text-white">
    پرش به محتوا
  </a>

  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
      <a href="{% url 'schedules:weekly' %}" class="flex items-center gap-2.5 rounded-lg">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
          </svg>
        </span>
        <span class="text-base font-semibold tracking-tight">برنامه هفتگی کلاس‌ها</span>
      </a>

      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle
                class="btn h-9 w-9 !px-0" aria-label="تغییر حالت روشن و تاریک" title="تغییر حالت روشن و تاریک">
          <svg data-icon="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" class="hidden h-5 w-5" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg data-icon="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" class="hidden h-5 w-5" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  {% if messages %}
    <div class="mx-auto max-w-7xl space-y-2 px-4 pt-4 sm:px-6">
      {% for message in messages %}
        <div data-message
             class="flex items-center justify-between gap-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800
                    dark:border-emerald-900 dark:bg-emerald-950/50 dark:text-emerald-200"
             role="status">
          <span>{{ message }}</span>
          <button type="button" data-message-close class="rounded-md px-1 text-lg leading-none opacity-70 hover:opacity-100"
                  aria-label="بستن پیام">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main id="main" class="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-7xl px-4 pb-10 pt-4 text-center text-xs text-slate-400 dark:text-slate-500 sm:px-6">
    برنامه هفتگی کلاس‌ها
  </footer>

  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
