# Production override.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Intended topology:
#   Cloudflare -> central nginx -> web-edge network -> scheduler-web:8000
#
# Notes:
#   * The web container does NOT publish port 8000 to the host. The central
#     nginx reaches it over the external `web-edge` network using the alias
#     `scheduler-web`.
#   * PostgreSQL stays on the compose-internal network only; it is never
#     attached to `web-edge` and never published.
#   * The external `web-edge` network must already exist on the host.
services:
  web:
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-1}
      --timeout ${GUNICORN_TIMEOUT:-30}
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Tehran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      default: {}
      web-edge:
        aliases:
          - scheduler-web
    restart: always

networks:
  web-edge:
    external: true
