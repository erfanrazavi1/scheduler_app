# Production-oriented override: Gunicorn, DEBUG off, WhiteNoise static files.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
services:
  web:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY for production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS for production}
    restart: always
